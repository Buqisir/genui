<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>立体棱镜光路（样张）</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f6f5f0; color: #222; }
  .wrap { display: flex; gap: 16px; padding: 16px; }
  svg { background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: grab; user-select: none; }
  .panel { width: 270px; font-size: 14px; line-height: 1.6; }
  label { display: block; margin-top: 12px; }
  input[type=range] { width: 100%; }
  button { margin: 6px 6px 0 0; padding: 4px 10px; }
  .note { color: #666; font-size: 12px; }
</style>
<div class="wrap">
  <svg id="s" width="780" height="560" viewBox="-390 -280 780 560"></svg>
  <div class="panel">
    <b>立体棱镜光路（样张）</b>
    <div><button id="v3d">立体视角</button><button id="v2d">考卷视角</button></div>
    <label>入射角 <span id="ia"></span>°<input type="range" id="inc" min="5" max="85" value="50"></label>
    <label>偏离主截面 <span id="ta"></span>°<input type="range" id="tilt" min="0" max="35" value="0"></label>
    <label><input type="checkbox" id="band"> 狭缝光（一排平行光）</label>
    <label><input type="checkbox" id="white" checked> 白光色散</label>
    <label>光束宽度 <span id="bwv"></span><input type="range" id="bw" min="0" max="60" value="0"></label>
    <label><input type="checkbox" id="loss"> 反射损失和亮度</label>
    <label><input type="checkbox" id="real"> 真实比例</label>
    <label>玻璃 <select id="glass"><option value="bk7">冕牌玻璃 K9（BK7）</option><option value="sf11">重火石玻璃（SF11）</option></select></label>
    <label><input type="checkbox" id="dark" checked> 暗室</label>
    <p class="note">在画面上拖动可以旋转。默认色散放大约 5 倍、只画 7 种色光，便于看清规律；勾选「真实比例」后按真实玻璃的色散公式（Sellmeier）计算 400–700 nm 共 31 个波长，左下角小窗把屏上的光谱放大显示。「光束宽度」给光加上粗细，看各色光怎样重叠；「反射损失和亮度」按菲涅耳公式算每个面反射掉多少，并画出反射光（亮度按平方根显示，弱反射也看得见）。</p>
    <p id="info" class="note"></p>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const S = $('s')
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]]
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]]
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k]
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
const norm = (a) => mul(a, 1 / Math.hypot(...a))
const rad = (d) => (d * Math.PI) / 180

// Equilateral cross-section, apex up, extruded along z; centroid at the origin.
const A = 2, H = Math.sqrt(3), LEN = 3, YC = H / 3
const tri = [[-A / 2, -YC], [A / 2, -YC], [0, H - YC]]
const V = []
for (const z of [-LEN / 2, LEN / 2]) for (const [x, y] of tri) V.push([x, y, z])
const FACES = [[0, 1, 2], [5, 4, 3], [0, 3, 4, 1], [1, 4, 5, 2], [2, 5, 3, 0]]
const PLANES = FACES.map((f) => {
  let n = norm(cross(sub(V[f[1]], V[f[0]]), sub(V[f[2]], V[f[0]])))
  if (dot(n, V[f[0]]) < 0) n = mul(n, -1)
  return { n, d: dot(n, V[f[0]]) }
})
const EDGES = []
FACES.forEach((f, fi) => f.forEach((v, k) => {
  const w = f[(k + 1) % f.length]
  const e = EDGES.find((e) => (e.a === w && e.b === v))
  if (e) e.f2 = fi
  else EDGES.push({ a: v, b: w, f1: fi })
}))

// The prism sits on a pedestal so the downward-deviated fan reaches the screen before the floor.
const FLOOR_Y = -YC - 2.2
const SCREEN_X = 3.9, SCREEN_Y = [FLOOR_Y, 1.4], SCREEN_Z = [-2.2, 2.8]
const PED = { x: [-1.15, 1.15], z: [-1.75, 1.75], y: [FLOOR_Y, -YC] }
const COLORS = [[0.68, '#e0302a'], [0.62, '#f07d10'], [0.58, '#e2b800'], [0.53, '#2ea83a'], [0.49, '#14a5b8'], [0.45, '#3557e8'], [0.41, '#8a3ae0']]
// Cauchy n = A + B/λ², B exaggerated about 5x so the fan is visible at this scale.
const nExaggerated = (lam) => 1.5 + 0.02 / (lam * lam)
// Sellmeier coefficients (λ in μm), Schott catalogue values; K9 is the Chinese equivalent of N-BK7.
const SELLMEIER = {
  bk7: { name: '冕牌玻璃 K9', B: [1.03961212, 0.231792344, 1.01046945], C: [0.00600069867, 0.0200179144, 103.560653] },
  sf11: { name: '重火石玻璃 SF11', B: [1.73759695, 0.313747346, 1.89878101], C: [0.013188707, 0.0623068142, 155.23629] },
}
const nSellmeier = (g, lam) => { const l2 = lam * lam; return Math.sqrt(1 + g.B.reduce((s, b, i) => s + (b * l2) / (l2 - g.C[i]), 0)) }
// Approximate visible-wavelength colour (Bruton), dimmed toward the ends of the spectrum.
function wl2rgb(nm) {
  let r = 0, g = 0, b = 0
  if (nm < 440) { r = -(nm - 440) / 60; b = 1 } else if (nm < 490) { g = (nm - 440) / 50; b = 1 } else if (nm < 510) { g = 1; b = -(nm - 510) / 20 }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1 } else if (nm < 645) { r = 1; g = -(nm - 645) / 65 } else r = 1
  const f = nm < 420 ? 0.3 + (0.7 * (nm - 380)) / 40 : nm > 680 ? 0.3 + (0.7 * (750 - nm)) / 70 : 1
  const c = (v) => Math.round(255 * Math.pow(v * f, 0.8))
  return `rgb(${c(r)},${c(g)},${c(b)})`
}
const REAL_WAVES = Array.from({ length: 31 }, (_, i) => { const nm = 700 - i * 10; return [nm / 1000, wl2rgb(nm)] })

function refract(i, n, eta) {
  const c = -dot(n, i)
  const k = 1 - eta * eta * (1 - c * c)
  return k < 0 ? null : norm(add(mul(i, eta), mul(n, eta * c - Math.sqrt(k))))
}
const reflect = (i, n) => add(i, mul(n, -2 * dot(n, i)))

function enter(o, d) {
  let t0 = -Infinity, t1 = Infinity, face = -1
  PLANES.forEach((p, k) => {
    const dn = dot(p.n, d), t = (p.d - dot(p.n, o)) / dn
    if (dn < 0) { if (t > t0) { t0 = t; face = k } } else if (dn > 0) t1 = Math.min(t1, t)
  })
  return t0 < t1 && t0 > 0 ? { t: t0, face } : null
}
function leave(o, d) {
  let best = Infinity, face = -1
  PLANES.forEach((p, k) => {
    const dn = dot(p.n, d)
    if (dn > 1e-9) { const t = (p.d - dot(p.n, o)) / dn; if (t > 1e-7 && t < best) { best = t; face = k } }
  })
  return { t: best, face }
}

// Unpolarised Fresnel reflectance: mean of the s and p amplitudes squared.
function fresnel(ci, ct, n1, n2) {
  const rs = (n1 * ci - n2 * ct) / (n1 * ci + n2 * ct), rp = (n2 * ci - n1 * ct) / (n2 * ci + n1 * ct)
  return (rs * rs + rp * rp) / 2
}

// Each segment carries the intensity I it starts with; refl lists the partial reflections split off.
function trace(o, d, ng) {
  const segs = [], refl = []
  const hit = enter(o, d)
  if (!hit) return { segs: [{ p: o, q: add(o, mul(d, 9)), I: 1 }], refl, tir: 0, I: 1 }
  let p = add(o, mul(d, hit.t)), I = 1
  segs.push({ p: o, q: p, I })
  const nIn = PLANES[hit.face].n
  const t0 = refract(d, nIn, 1 / ng)
  const R0 = fresnel(-dot(nIn, d), -dot(nIn, t0), 1, ng)
  refl.push({ p, d: reflect(d, nIn), I: R0, outside: true })
  I *= 1 - R0
  d = t0
  let tir = 0, Rs = [R0]
  for (let k = 0; k < 8; k++) {
    const out = leave(p, d)
    const q = add(p, mul(d, out.t))
    segs.push({ p, q, inside: true, I })
    p = q
    const inward = mul(PLANES[out.face].n, -1)
    const t = refract(d, inward, ng)
    if (t) {
      const R = fresnel(-dot(inward, d), -dot(inward, t), ng, 1)
      refl.push({ p, d: reflect(d, inward), I: I * R, outside: false })
      Rs.push(R)
      I *= 1 - R
      d = t
      break
    }
    d = reflect(d, inward); tir++
  }
  let end = add(p, mul(d, 7)), onScreen = null
  if (d[0] > 0) {
    const t = (SCREEN_X - p[0]) / d[0], q = add(p, mul(d, t))
    if (q[1] > SCREEN_Y[0] && q[1] < SCREEN_Y[1] && q[2] > SCREEN_Z[0] && q[2] < SCREEN_Z[1]) { end = q; onScreen = q }
  }
  segs.push({ p, q: end, I })
  return { segs, refl, tir, onScreen, dOut: d, I, Rs }
}

let yaw = -38, pitch = 22, anim = null
const SCALE = 72, SHIFT = -1.0
function proj(v) {
  const cy = Math.cos(rad(yaw)), sy = Math.sin(rad(yaw)), cp = Math.cos(rad(pitch)), sp = Math.sin(rad(pitch))
  const x = v[0] + SHIFT, x1 = x * cy + v[2] * sy, z1 = -x * sy + v[2] * cy
  const y2 = v[1] * cp - z1 * sp, z2 = v[1] * sp + z1 * cp
  return [x1 * SCALE, -y2 * SCALE, z2]
}
const rot = (n) => { const a = proj(n), b = proj([0, 0, 0]); return a[2] - b[2] }
const pts = (arr) => arr.map((v) => proj(v).slice(0, 2).map((c) => c.toFixed(1)).join(',')).join(' ')
const el = (tag, attrs, text, parent = S) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag)
  for (const k in attrs) e.setAttribute(k, attrs[k])
  if (text) e.textContent = text
  // mix-blend-mode on a <g> only blends the finished group; children must blend individually to add up.
  const blendMode = parent.getAttribute && parent.getAttribute('data-blend')
  if (blendMode) e.setAttribute('style', `mix-blend-mode: ${blendMode}`)
  parent.appendChild(e)
  return e
}
const line2 = (a3, b3) => { const a = proj(a3), b = proj(b3); return { x1: a[0], y1: a[1], x2: b[0], y2: b[1] } }
// Convex hull in the floor plane (x, z), returned as 3D points.
function hull(ps) {
  const p = ps.slice().sort((a, b) => a[0] - b[0] || a[2] - b[2])
  const cr = (o, a, b) => (a[0] - o[0]) * (b[2] - o[2]) - (a[2] - o[2]) * (b[0] - o[0])
  const lo = [], up = []
  for (const q of p) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q) }
  for (const q of p.reverse()) { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q) }
  return lo.slice(0, -1).concat(up.slice(0, -1))
}

function draw() {
  S.innerHTML = ''
  const inc = +$('inc').value, tilt = +$('tilt').value, band = $('band').checked, white = $('white').checked
  $('ia').textContent = inc; $('ta').textContent = tilt
  // Left face outward normal is (-cos30°, sin30°); the ray comes from below that normal.
  const al = rad(-30 + inc)
  const d0 = norm([Math.cos(rad(tilt)) * Math.cos(al), Math.cos(rad(tilt)) * Math.sin(al), Math.sin(rad(tilt))])
  const mid = [(tri[0][0] + tri[2][0]) / 2, (tri[0][1] + tri[2][1]) / 2]
  const zs = band ? [-1.0, -0.5, 0, 0.5, 1.0] : [0]
  const real = $('real').checked, glass = SELLMEIER[$('glass').value]
  $('glass').disabled = !real
  const nOf = (lam) => (real ? nSellmeier(glass, lam) : nExaggerated(lam))
  const waves = white ? (real ? REAL_WAVES : COLORS) : [[0.589, '#d9480f']]
  const facing = FACES.map((f, k) => rot(PLANES[k].n) > 0)
  const dark = $('dark').checked
  const T = dark
    ? { bg0: '#212b39', bg1: '#090c11', floor0: '#202835', floor1: '#11161d', grid: '#ffffff', screen: '#2a3039', screenEdge: '#525b68', text: '#9aa4b2', glass: '150,215,232', edge: '#86d6e8', edgeHi: '#f4ffff', beam: '#ffffff', mono: '#ff7a3d', section: '#e8b04a', shadowOp: 0.6, glowOp: 0.55 }
    : { bg0: '#ffffff', bg1: '#e9edf1', floor0: '#eef1f4', floor1: '#dde2e7', grid: '#000000', screen: '#f5f3ed', screenEdge: '#a9a597', text: '#6b6b6b', glass: '110,180,212', edge: '#2f7f9c', edgeHi: '#ffffff', beam: '#3a3a3a', mono: '#d9480f', section: '#c27c0e', shadowOp: 0.2, glowOp: 0.22 }
  const LIGHT = norm([-0.35, 1, 0.45])
  const YF = FLOOR_Y

  const defs = el('defs', {})
  let defStr = `
    <radialGradient id="bg" cx="38%" cy="30%" r="85%"><stop offset="0" stop-color="${T.bg0}"/><stop offset="1" stop-color="${T.bg1}"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.floor1}"/><stop offset="1" stop-color="${T.floor0}"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="hair" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.6"/></filter>`
  el('rect', { x: -390, y: -280, width: 780, height: 560, fill: 'url(#bg)' })

  if (pitch > 3) {
    const fl = [[-4.5, YF, -3], [5.5, YF, -3], [5.5, YF, 5], [-4.5, YF, 5]]
    el('polygon', { points: pts(fl), fill: 'url(#floor)' })
    for (let g = -4; g <= 5; g++) el('line', { ...line2([g, YF, -3], [g, YF, 5]), stroke: T.grid, 'stroke-opacity': 0.05 })
    for (let g = -3; g <= 5; g++) el('line', { ...line2([-4.5, YF, g], [5.5, YF, g]), stroke: T.grid, 'stroke-opacity': 0.05 })
    const pedTop = [[PED.x[0], PED.y[1], PED.z[0]], [PED.x[1], PED.y[1], PED.z[0]], [PED.x[1], PED.y[1], PED.z[1]], [PED.x[0], PED.y[1], PED.z[1]]]
    const sh = hull(V.concat(pedTop).map((v) => sub(v, mul(LIGHT, (v[1] - YF) / LIGHT[1]))))
    el('polygon', { points: pts(sh), fill: '#000', 'fill-opacity': T.shadowOp, filter: 'url(#soft)' })
  }
  // Opaque pedestal: draw only the box faces turned toward the viewer.
  const [px0, px1] = PED.x, [py0, py1] = PED.y, [pz0, pz1] = PED.z
  const box = [
    { n: [0, 1, 0], q: [[px0, py1, pz0], [px1, py1, pz0], [px1, py1, pz1], [px0, py1, pz1]], s: 1 },
    { n: [0, 0, 1], q: [[px0, py0, pz1], [px1, py0, pz1], [px1, py1, pz1], [px0, py1, pz1]], s: 0.8 },
    { n: [0, 0, -1], q: [[px0, py0, pz0], [px1, py0, pz0], [px1, py1, pz0], [px0, py1, pz0]], s: 0.8 },
    { n: [1, 0, 0], q: [[px1, py0, pz0], [px1, py0, pz1], [px1, py1, pz1], [px1, py1, pz0]], s: 0.6 },
    { n: [-1, 0, 0], q: [[px0, py0, pz0], [px0, py0, pz1], [px0, py1, pz1], [px0, py1, pz0]], s: 0.6 },
  ]
  for (const b of box) {
    if (rot(b.n) <= 0) continue
    const c = dark ? Math.round(40 + 22 * b.s) : Math.round(170 + 50 * b.s)
    el('polygon', { points: pts(b.q), fill: `rgb(${c},${c + 4},${c + 10})`, stroke: dark ? '#3c4552' : '#9aa3ad', 'stroke-width': 0.8 })
  }

  FACES.forEach((f, k) => { if (!facing[k]) el('polygon', { points: pts(f.map((i) => V[i])), fill: `rgba(${T.glass},0.07)` }) })
  EDGES.forEach((e) => {
    if (facing[e.f1] || facing[e.f2]) return
    el('line', { ...line2(V[e.a], V[e.b]), stroke: T.edge, 'stroke-width': 1, 'stroke-opacity': 0.3 })
  })
  const sc = [[SCREEN_X, SCREEN_Y[0], SCREEN_Z[0]], [SCREEN_X, SCREEN_Y[1], SCREEN_Z[0]], [SCREEN_X, SCREEN_Y[1], SCREEN_Z[1]], [SCREEN_X, SCREEN_Y[0], SCREEN_Z[1]]]
  el('polygon', { points: pts(sc), fill: T.screen, stroke: T.screenEdge, 'stroke-width': 1 })
  const lab = proj([SCREEN_X, SCREEN_Y[1] + 0.15, SCREEN_Z[0]])
  el('text', { x: lab[0], y: lab[1], 'font-size': 13, fill: T.text }, '光屏')

  const z0 = 0
  el('polygon', { points: pts(tri.map(([x, y]) => [x, y, z0])), fill: T.section, 'fill-opacity': 0.06, stroke: T.section, 'stroke-opacity': 0.8, 'stroke-dasharray': '5 4', 'stroke-width': 1.1 })
  const pl = proj([tri[2][0] + 0.12, tri[2][1] - 0.05, z0])
  el('text', { x: pl[0], y: pl[1], 'font-size': 12, fill: T.section }, '主截面')

  // In the dark room, overlapping colours add up toward white, as real light does.
  const blend = dark ? { 'data-blend': 'screen' } : {}
  const gGlow = el('g', { filter: 'url(#glow)', opacity: T.glowOp, ...blend })
  const gCore = el('g', { ...blend })
  const thin = real && white
  const lossOn = $('loss').checked
  const bw = +$('bw').value / 100
  $('bwv').textContent = bw ? `${(bw * 10).toFixed(1)} mm` : '0（理想光线）'
  const bright = (I) => (lossOn ? I : 1)
  const ray = (a3, b3, col, w, op) => {
    el('line', { ...line2(a3, b3), stroke: col, 'stroke-width': w * (thin ? 2.5 : 4), 'stroke-linecap': 'round', 'stroke-opacity': thin ? 0.35 * op : op }, null, gGlow)
    el('line', { ...line2(a3, b3), stroke: col, 'stroke-width': thin ? w * 0.7 : w, 'stroke-opacity': thin ? op * 0.55 : op, 'stroke-linecap': 'round' }, null, gCore)
  }
  const quad = (a, b, c, d, col, op) => {
    const poly = pts([a, b, c, d])
    el('polygon', { points: poly, fill: col, 'fill-opacity': op * 0.6 }, null, gGlow)
    el('polygon', { points: poly, fill: col, 'fill-opacity': op }, null, gCore)
  }
  // A parallel beam stays parallel through flat faces, so its two edge rays bound it exactly.
  const perp = norm(cross(d0, [0, 0, 1]))
  const beamOp = (white ? (real ? 0.16 : 0.42) : 0.6) * (dark ? 1 : 0.6)
  let info = [], hits = waves.map(() => []), spans = waves.map(() => []), hits0 = [], spans0 = [], devs = [], centre = null
  for (const z of zs) {
    const P = [mid[0], mid[1], z]
    const o = sub(P, mul(d0, 3.2))
    const oA = add(o, mul(perp, bw / 2)), oB = sub(o, mul(perp, bw / 2))
    if (bw > 0) {
      const eA = enter(oA, d0), eB = enter(oB, d0)
      if (eA && eB) quad(oA, add(oA, mul(d0, eA.t)), add(oB, mul(d0, eB.t)), oB, white ? T.beam : T.mono, dark ? 0.9 : 0.35)
    } else ray(o, P, white ? T.beam : T.mono, 2, 1)
    waves.forEach(([lam, col], wi) => {
      const n = nOf(lam)
      const r = trace(o, d0, n)
      const lines = () => r.segs.slice(1).forEach((s) => ray(s.p, s.q, col, s.inside ? 1.5 : 1.4, (s.inside ? 0.8 : 0.95) * bright(s.I)))
      if (bw > 0) {
        const ra = trace(oA, d0, n), rb = trace(oB, d0, n)
        if (ra.segs.length === rb.segs.length) {
          for (let k = 1; k < ra.segs.length; k++) quad(ra.segs[k].p, ra.segs[k].q, rb.segs[k].q, rb.segs[k].p, col, beamOp * bright(ra.segs[k].I))
        } else lines()
        if (ra.onScreen && rb.onScreen) {
          spans[wi].push([ra.onScreen, rb.onScreen])
          if (z === 0) spans0.push({ y1: ra.onScreen[1], y2: rb.onScreen[1], col, I: bright(ra.I) })
        }
      } else lines()
      if (r.onScreen) hits[wi].push(r.onScreen)
      if (z === 0) {
        if (wi === Math.floor(waves.length / 2)) centre = r
        if (r.onScreen) hits0.push({ y: r.onScreen[1], col })
        const dev = Math.acos(Math.max(-1, Math.min(1, dot(d0, r.dOut)))) * 180 / Math.PI
        devs.push(dev)
        if (wi === 0 || wi === waves.length - 1) {
          const name = !white ? `单色光（${Math.round(lam * 1000)} nm）` : `${wi === 0 ? '红光' : '紫光'}（${Math.round(lam * 1000)} nm）`
          info.push(`${name}：n = ${n.toFixed(4)}，偏折 ${dev.toFixed(real ? 2 : 1)}°${r.tir ? `，全反射 ${r.tir} 次` : ''}`)
        }
      }
    })
  }
  const anyTir = info.some((s) => s.includes('全反射'))
  if (anyTir) info.push('光在第二个面上发生了全反射。折射率越大，临界角越小；增大入射角，光才能从第二个面射出。')
  else if (white && devs.length > 1) info.push(`红紫偏折相差 ${(devs[devs.length - 1] - devs[0]).toFixed(real ? 2 : 1)}°${real ? `（${glass.name}，真实值）` : '（已放大约 5 倍）'}`)
  if (lossOn && centre) {
    const [rIn, rOut] = centre.refl
    const c = white ? T.beam : T.mono
    // Opacity follows √I so a 4 % reflection stays visible, roughly as the eye perceives it.
    if (rIn) ray(rIn.p, add(rIn.p, mul(rIn.d, 2.6)), c, 1.2, Math.sqrt(rIn.I))
    if (rOut && !rOut.outside) { const lv = leave(rOut.p, rOut.d); ray(rOut.p, add(rOut.p, mul(rOut.d, lv.t)), c, 1, Math.sqrt(rOut.I)) }
    const pct = (x) => (x * 100).toFixed(1) + '%'
    info.push(`反射损失（${white ? `${Math.round(waves[Math.floor(waves.length / 2)][0] * 1000)} nm` : '该色光'}）：入射面反射 ${pct(centre.Rs[0])}${centre.Rs[1] != null ? `，出射面反射 ${pct(centre.Rs[1])}` : ''}，透过 ${pct(centre.I)}`)
  }
  if (bw > 0 && white) info.push('光束有宽度：各色光大部分重叠，屏上中间仍是白的，只有两边带颜色。光束越窄（用狭缝）、屏越远，颜色才分得开。')
  if (bw > 0) waves.forEach(([, col], wi) => {
    const s = spans[wi]
    if (!s.length) return
    const poly = s.length > 1
      ? [s[0][0], s[0][1], s[s.length - 1][1], s[s.length - 1][0]]
      : [add(s[0][0], [0, 0, -0.06]), add(s[0][1], [0, 0, -0.06]), add(s[0][1], [0, 0, 0.06]), add(s[0][0], [0, 0, 0.06])]
    const op = (white ? (real ? 0.3 : 0.6) : 0.85) * (dark ? 1 : 0.6)
    el('polygon', { points: pts(poly), fill: col, 'fill-opacity': op }, null, gGlow)
    el('polygon', { points: pts(poly), fill: col, 'fill-opacity': op }, null, gCore)
  })
  else waves.forEach(([, col], wi) => {
    const h = hits[wi]
    if (h.length > 1) {
      el('polyline', { points: pts(h), stroke: col, 'stroke-width': 16, 'stroke-linecap': 'round', fill: 'none' }, null, gGlow)
      el('polyline', { points: pts(h), stroke: col, 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', 'stroke-opacity': 0.9 }, null, gCore)
    } else if (h.length === 1) {
      const p = proj(h[0])
      el('circle', { cx: p[0], cy: p[1], r: 9, fill: col }, null, gGlow)
      el('circle', { cx: p[0], cy: p[1], r: 3.5, fill: col }, null, gCore)
    }
  })

  // Glass: Fresnel-like opacity (faces seen edge-on reflect more), a soft gradient and a clipped glint band.
  const front = []
  FACES.forEach((f, k) => {
    if (!facing[k]) return
    const P2 = f.map((i) => proj(V[i]))
    const xs = P2.map((p) => p[0]), ys = P2.map((p) => p[1])
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys)
    const nz = Math.min(1, rot(PLANES[k].n)), lam = Math.max(0, dot(PLANES[k].n, LIGHT))
    const a = 0.06 + 0.34 * Math.pow(1 - nz, 2) + 0.08 * lam
    const poly = P2.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')
    defStr += `<linearGradient id="fg${k}" gradientUnits="userSpaceOnUse" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}">
        <stop offset="0" stop-color="rgb(${T.glass})" stop-opacity="${(a * 1.6).toFixed(3)}"/>
        <stop offset="0.55" stop-color="rgb(${T.glass})" stop-opacity="${(a * 0.55).toFixed(3)}"/>
        <stop offset="1" stop-color="rgb(${T.glass})" stop-opacity="${(a * 1.25).toFixed(3)}"/></linearGradient>
      <clipPath id="fc${k}"><polygon points="${poly}"/></clipPath>`
    front.push({ poly, x0, x1, y0, y1, lam, k })
  })
  front.forEach(({ poly, x0, x1, y0, y1, lam, k }) => {
    el('polygon', { points: poly, fill: `url(#fg${k})` })
    const w = x1 - x0
    const band = (f0, f1, op) => el('polygon', {
      points: `${x0 + w * f0},${y1 + 6} ${x0 + w * f1},${y1 + 6} ${x0 + w * (f1 + 0.32)},${y0 - 6} ${x0 + w * (f0 + 0.32)},${y0 - 6}`,
      fill: '#ffffff', 'fill-opacity': op, 'clip-path': `url(#fc${k})`,
    })
    band(0.1, 0.24, 0.05 + 0.08 * lam)
    band(0.27, 0.31, 0.08 + 0.12 * lam)
  })
  EDGES.forEach((e) => {
    if (!(facing[e.f1] || facing[e.f2])) return
    el('line', { ...line2(V[e.a], V[e.b]), stroke: T.edge, 'stroke-width': 2.6, 'stroke-opacity': 0.85, 'stroke-linecap': 'round' })
    el('line', { ...line2(V[e.a], V[e.b]), stroke: T.edgeHi, 'stroke-width': 0.9, 'stroke-opacity': 0.8, filter: 'url(#hair)' })
  })
  defs.innerHTML = defStr
  // Magnifier: the screen spectrum along y for the central ray, scaled to fill the inset.
  if (white && bw > 0 && spans0.length > 1) {
    const ys = spans0.flatMap((s) => [s.y1, s.y2]), lo = Math.min(...ys), hi = Math.max(...ys)
    const W = 230, Hh = 26, X0 = -372, Y0 = 222
    const pxPerUnit = (W * 0.8) / Math.max(hi - lo, 1e-6), mag = pxPerUnit / SCALE
    el('rect', { x: X0 - 8, y: Y0 - 26, width: W + 16, height: Hh + 38, rx: 6, fill: dark ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.85)', stroke: dark ? '#3a4350' : '#c9c9c9' })
    el('text', { x: X0, y: Y0 - 10, 'font-size': 12, fill: T.text }, `屏上光斑（宽度放大 ${mag >= 1.5 ? Math.round(mag) : 1} 倍）`)
    el('rect', { x: X0, y: Y0, width: W, height: Hh, fill: '#000' })
    const g = el('g', { 'data-blend': 'screen' })
    const op = real ? 0.3 : 0.6
    for (const s of spans0) {
      const xa = X0 + W * 0.1 + (hi - Math.max(s.y1, s.y2)) * pxPerUnit, xb = X0 + W * 0.1 + (hi - Math.min(s.y1, s.y2)) * pxPerUnit
      el('rect', { x: xa, y: Y0, width: Math.max(1, xb - xa), height: Hh, fill: s.col, 'fill-opacity': op * s.I }, null, g)
    }
    el('text', { x: X0 + W * 0.1, y: Y0 + Hh + 11, 'font-size': 10, fill: T.text, 'text-anchor': 'middle' }, '红边')
    el('text', { x: X0 + W * 0.9, y: Y0 + Hh + 11, 'font-size': 10, fill: T.text, 'text-anchor': 'middle' }, '紫边')
  } else if (white && hits0.length > 1) {
    const ys = hits0.map((h) => h.y), lo = Math.min(...ys), hi = Math.max(...ys)
    const W = 230, Hh = 26, X0 = -372, Y0 = 222
    const span = Math.max(hi - lo, 1e-6), pxPerUnit = (W * 0.8) / span, mag = pxPerUnit / SCALE
    el('rect', { x: X0 - 8, y: Y0 - 26, width: W + 16, height: Hh + 38, rx: 6, fill: dark ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.85)', stroke: dark ? '#3a4350' : '#c9c9c9' })
    el('text', { x: X0, y: Y0 - 10, 'font-size': 12, fill: T.text }, `屏上光谱（宽度放大 ${mag >= 1.5 ? Math.round(mag) : 1} 倍）`)
    el('rect', { x: X0, y: Y0, width: W, height: Hh, fill: '#000' })
    const g = el('g', { 'data-blend': 'screen' })
    const xs = hits0.map((h) => X0 + W * 0.1 + (hi - h.y) * pxPerUnit)
    hits0.forEach((h, i) => {
      // Short wavelengths spread further apart, so each bar spans the gap to its neighbours.
      const left = i > 0 ? (xs[i] - xs[i - 1]) / 2 : 3, right = i < xs.length - 1 ? (xs[i + 1] - xs[i]) / 2 : 3
      const pad = real ? 1.15 : 0.6
      el('rect', { x: xs[i] - Math.abs(left) * pad, y: Y0, width: Math.max(2, (Math.abs(left) + Math.abs(right)) * pad), height: Hh, fill: h.col }, null, g)
    })
    el('text', { x: X0 + W * 0.1, y: Y0 + Hh + 11, 'font-size': 10, fill: T.text, 'text-anchor': 'middle' }, '红')
    el('text', { x: X0 + W * 0.9, y: Y0 + Hh + 11, 'font-size': 10, fill: T.text, 'text-anchor': 'middle' }, '紫')
  }
  if (tilt > 0) info.push('光线已离开主截面：考卷上的二维图画不出这条光路。')
  $('info').innerHTML = info.join('<br>')
}

function goTo(y, p) {
  const y0 = yaw, p0 = pitch, t0 = performance.now()
  cancelAnimationFrame(anim)
  const step = (t) => {
    const k = Math.min(1, (t - t0) / 700), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
    yaw = y0 + (y - y0) * e; pitch = p0 + (p - p0) * e; draw()
    if (k < 1) anim = requestAnimationFrame(step)
  }
  anim = requestAnimationFrame(step)
}
$('v3d').onclick = () => goTo(-38, 22)
$('v2d').onclick = () => goTo(0, 0)
for (const id of ['inc', 'tilt', 'band', 'white', 'dark', 'real', 'glass', 'bw', 'loss']) $(id).oninput = draw
let drag = null
S.onpointerdown = (e) => { drag = [e.clientX, e.clientY, yaw, pitch]; S.setPointerCapture(e.pointerId) }
S.onpointermove = (e) => {
  if (!drag) return
  yaw = drag[2] + (e.clientX - drag[0]) * 0.4
  pitch = Math.max(-80, Math.min(80, drag[3] + (e.clientY - drag[1]) * 0.4))
  draw()
}
S.onpointerup = () => { drag = null }
const q = new URLSearchParams(location.search)
if (q.has('yaw')) yaw = +q.get('yaw')
if (q.has('pitch')) pitch = +q.get('pitch')
if (q.has('tilt')) $('tilt').value = q.get('tilt')
if (q.has('inc')) $('inc').value = q.get('inc')
if (q.has('band')) $('band').checked = true
if (q.has('light')) $('dark').checked = false
if (q.has('real')) $('real').checked = true
if (q.has('glass')) $('glass').value = q.get('glass')
if (q.has('bw')) $('bw').value = q.get('bw')
if (q.has('loss')) $('loss').checked = true
draw()
</script>
</html>
