# Numeric answer key for the generation gate. Never sent to the model.
# Each entry: a list of alternatives (unit variants); the lesson's `answers` must contain
# a value within 1% of one of them. Symbolic-only problems (r5-03, r5-04, r6-05) are left out
# because the lesson picks its own representative parameter values.
